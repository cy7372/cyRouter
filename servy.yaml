# Servy 配置 - cyRouter LLM API Router

name: cyRouter
display_name: cyRouter LLM API Router
description: LLM API 统一路由 - OpenAI/Anthropic 兼容接口
executable: C:\Users\CyYu\miniconda3\python.exe
args: main.py
working_directory: D:\Programs\cyRouter

# 启动类型
startup_type: auto

# 进程优先级
priority: normal

# 日志配置
log:
  directory: D:\Programs\cyRouter\logs
  stdout: server-out.log
  stderr: server-err.log
  rotate_size: 10MB
  rotate_count: 5

# 健康检查
health_check:
  url: http://localhost:20100/health
  interval: 60s
  timeout: 10s
  retries: 3

# 依赖服务
dependencies:
  - Dhcp
  - Dns

# 重启策略
restart:
  on_failure: true
  delay: 5s
  max_retries: 3
